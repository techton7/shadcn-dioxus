[package]
name = "shadcn-dioxus"
version = "0.0.1"
edition = "2024"
description = "Beautifully designed, accessible components for Dioxus built on Monoxus primitives."
readme = "README.md"
license = "MIT"
repository = "https://github.com/techton7/shadcn-dioxus"
exclude = ["tests/gui/**"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["devtools", "document", "hooks", "html", "mounted", "signals", "macro", "asset", "launch"] }


[features]
default = []
native = [
    "dep:blitz-dom",
    "dep:dioxus-native",
    "dep:dioxus-native-dom",
    "dep:oxidase",
    "dep:blitz-traits",
    "oxidase/native",
    "oxidase/blitz-host",
]



[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { version = "0.3.0-beta.2", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
blitz-test-harness = { version = "0.3.0-beta.2", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
dioxus-native-dom = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
oxidase = { version = "0.1.11", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.11", features = ["native"], optional = true }
dioxus-native = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
blitz-traits = { version = "0.3.0-beta.2", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "Location",
] }
wasm-bindgen = "0.2"

[[example]]
name = "playground"
path = "examples/playground/main.rs"
